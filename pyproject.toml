[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-replica-toolkit"
version = "0.12.0"
description = "Skill + visual QA toolkit for high-fidelity screenshot-driven UI reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Visual Replica contributors"}]
dependencies = [
  "Pillow>=10",
  "numpy>=1.26",
  "scikit-image>=0.22",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
deep = [
  "torch>=2.1",
  "torchvision>=0.16",
  "pytorch-msssim>=1.0.0",
  "lpips>=0.1.4",
]
ocr = ["pytesseract>=0.3.13"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
visual-replica = "visual_replica.cli:main"

[tool.setuptools.packages.find]
include = ["visual_replica*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
visual_replica = ["assets/*.mjs"]

[tool.ruff]
line-length = 120
target-version = "py310"
